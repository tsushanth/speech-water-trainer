<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Word Trainer</title>
<link rel="stylesheet" href="style.css">
</head>
<body>
  <div id="app">
    <div id="wordScreen">
      <div id="picture">💧</div>
      <div id="word">water</div>
      <button id="hearBtn">🔊 Hear the word</button>
      <button id="micBtn">🎤 Your turn</button>
      <button id="rewardNowBtn" class="secondaryBtn">⭐ Reward</button>
      <div id="photoControls">
        <label for="photoInput" class="secondaryBtn photoLabel">📷 Attach photo to this word</label>
        <input id="photoInput" type="file" accept="image/*" hidden>
        <button id="removePhotoBtn" class="secondaryBtn">🗑️ Remove photo</button>
      </div>
      <div id="status"></div>
      <div id="voiceRow">
        <span id="voiceClipStatus"></span>
        <button id="recordBtn" class="secondaryBtn">🎙️ Record my voice</button>
        <button id="clearClipBtn" class="secondaryBtn hidden">🗑️ Clear clip</button>
      </div>
      <div id="navRow">
        <button id="prevBtn">⬅️ Prev word</button>
        <button id="nextWordBtn">Next word ➡️</button>
      </div>
    </div>

    <div id="rewardScreen" class="hidden">
      <div id="rewardVideoWrap"></div>
      <button id="againBtn">Again!</button>
    </div>
  </div>

  <div id="setup">
    <label>Word list (word,emoji per line):</label>
    <textarea id="wordListInput" rows="20">more,➕
stop,✋
go,🚗
want,🙏
help,🆘
eat,🍽️
drink,🥤
open,📂
close,📁
look,👀
get,🤏
put,📌
give,🤲
come,👋
done,✅
play,🎲
no,👎
yes,👍
up,⬆️
down,⬇️
in,📥
out,📤
on,🔛
off,⭕
big,🐘
small,🐭
hot,🔥
cold,❄️
mom,👩
dad,👨
me,🙋
water,💧
cup,🧋
milk,🥛
juice,🧃
ball,⚽
book,📖
bath,🛁
bed,🛏️
shoe,👟
dog,🐶
cat,🐱
</textarea>
    <button id="applyWords">Apply</button>

    <label>Reward YouTube URL:</label>
    <input id="youtubeUrlInput" type="text" placeholder="https://www.youtube.com/watch?v=..." value="https://www.youtube.com/watch?v=8jmK6C3Q6ys">
    <button id="applyVideo">Apply</button>
  </div>

  <script src="app.js"></script>
</body>
</html>
